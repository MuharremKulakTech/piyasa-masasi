<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Okuyucu İstatistikleri · Piyasa Masası</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Inter:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#f5f6f8;--paper:#fff;--ink:#131a24;--muted:#5a6575;--line:#dde2e9;--accent:#c2410c;--goal:#13803b}
@media (prefers-color-scheme: dark){:root{--bg:#0d1219;--paper:#151c26;--ink:#e7ecf3;--muted:#97a2b3;--line:#263142;--accent:#f47a2c;--goal:#4cc77a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Inter",system-ui,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
h1{font:800 28px/1.15 "Archivo",Arial,sans-serif;margin:0 0 6px}
a{color:var(--accent)}
.muted{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:22px 0}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}
.tile b{display:block;font:500 26px "JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.goal{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:10px}
.goal i{display:block;height:100%;background:var(--goal)}
table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
td,th{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:8px;background:var(--accent);border-radius:4px;min-width:2px}
td.n{font-family:"JetBrains Mono",monospace;text-align:right;width:70px}
</style>
</head>
<body>
<div class="wrap">
  <a href="/">← Piyasa Masası</a>
  <h1>Okuyucu istatistikleri</h1>
  <p class="muted">Tekil günlük okuyucu: bir tarayıcı bir günde (Türkiye saati) kaç kez açarsa açsın bir kez sayılır. Botlar sayılmaz.</p>
  <div class="tiles">
    <div class="tile"><span>Bugün</span><b id="t-today">…</b></div>
    <div class="tile"><span>Son 7 gün ort.</span><b id="t-avg7">…</b></div>
    <div class="tile"><span>Son 30 gün toplam</span><b id="t-30">…</b></div>
    <div class="tile"><span>Sponsorluk hedefi: 1.000/gün</span><b id="t-goal">…</b><div class="goal"><i id="goal-bar" style="width:0"></i></div></div>
  </div>
  <table>
    <thead><tr><th>Gün</th><th></th><th style="text-align:right">Okuyucu</th></tr></thead>
    <tbody id="rows"><tr><td colspan="3" class="muted">Yükleniyor…</td></tr></tbody>
  </table>
</div>
<script>
fetch("/api/ziyaret?gunler=30").then(function(r){return r.json();}).then(function(j){
  var g = j.gunler || [];
  var max = Math.max.apply(null, g.map(function(x){return x.okuyucu;}).concat([1]));
  var fmt = function(n){ return Math.round(n).toLocaleString("tr-TR"); };
  var today = g[0] ? g[0].okuyucu : 0;
  var last7 = g.slice(0,7); var avg7 = last7.reduce(function(a,x){return a+x.okuyucu;},0) / Math.max(1,last7.length);
  document.getElementById("t-today").textContent = fmt(today);
  document.getElementById("t-avg7").textContent = fmt(avg7);
  document.getElementById("t-30").textContent = fmt(g.reduce(function(a,x){return a+x.okuyucu;},0));
  document.getElementById("t-goal").textContent = "%" + Math.min(100, Math.round(avg7/10));
  document.getElementById("goal-bar").style.width = Math.min(100, avg7/10) + "%";
  document.getElementById("rows").innerHTML = g.map(function(x){
    var d = new Date(x.gun + "T12:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"short",weekday:"short"});
    return "<tr><td>"+d+"</td><td style=\"width:55%\"><div class=\"bar\" style=\"width:"+(100*x.okuyucu/max)+"%\"></div></td><td class=\"n\">"+fmt(x.okuyucu)+"</td></tr>";
  }).join("");
}).catch(function(){ document.getElementById("rows").innerHTML = "<tr><td colspan=3>İstatistik şu an yüklenemedi.</td></tr>"; });
</script>
</body>
</html>
